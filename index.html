<!DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>GenZ Social Hub</title>
            <!-- Load Tailwind CSS -->
            <script src="https://cdn.tailwindcss.com"></script>
            <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
            <style>
                /* Custom scrollbar */
                ::-webkit-scrollbar { width: 8px; }
                ::-webkit-scrollbar-thumb { background: #f0abfc; border-radius: 4px; }
                ::-webkit-scrollbar-track { background: #111827; }
        
                /* Glow effect */
                .glow-card {
                    box-shadow: 0 0 40px rgba(139, 92, 246, 0.4);
                    transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
                }
                .vibrant-btn {
                    position: relative;
                    overflow: hidden;
                    box-shadow: 0 4px 15px rgba(240, 171, 252, 0.4);
                }
                .vibrant-btn:hover {
                    box-shadow: 0 6px 20px rgba(240, 171, 252, 0.6);
                    transform: translateY(-2px);
                }
                /* Step indicators */
                .step-indicator {
                    transition: all 0.3s;
                }
                /* Stories bar scroll */
                .overflow-x-scroll::-webkit-scrollbar {
                    height: 4px;
                }
                .overflow-x-scroll::-webkit-scrollbar-thumb {
                    background: #8b5cf6;
                    border-radius: 2px;
                }
            </style>
            <script>
                tailwind.config = {
                    theme: {
                        extend: {
                            fontFamily: {
                                sans: ['Inter', 'sans-serif'],
                            },
                            colors: {
                                'genz-primary': '#f0abfc',
                                'genz-secondary': '#8b5cf6',
                                'genz-bg': '#0f172a',
                            }
                        }
                    }
                }
            </script>
        </head>
    <body class="bg-genz-bg font-sans min-h-screen flex items-center justify-center p-4">
    
        <!-- Main App Container -->
        <div id="app-container" class="w-full max-w-md bg-gray-900 text-white rounded-3xl glow-card p-6 md:p-10 transition-all border-2 border-genz-secondary overflow-hidden">
            
            <!-- Header (Removed GenZ Social Hub) -->
            <header class="mb-8">
                <p id="tagline" class="text-gray-400 text-center text-lg md:text-xl">Create your account & set up your profile.</p>
            </header>
    
            <!-- Progress/Step Indicator -->
            <div id="step-indicators" class="flex justify-between items-center mb-10 w-full max-w-md mx-auto">
                <div id="step-1" class="step-indicator flex flex-col items-center">
                    <div class="w-10 h-10 flex items-center justify-center rounded-full bg-genz-primary text-gray-900 font-bold">1</div>
                    <span class="text-xs mt-1 text-genz-primary font-medium">Sign Up</span>
                </div>
                <div id="line-1" class="flex-1 h-1 mx-2 bg-gray-700 rounded-full"></div>
                <div id="step-2" class="step-indicator flex flex-col items-center">
                    <div class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-700 text-gray-400 font-bold">2</div>
                    <span class="text-xs mt-1 text-gray-400">Profile</span>
                </div>
                <div id="line-2" class="flex-1 h-1 mx-2 bg-gray-700 rounded-full"></div>
                <div id="step-3" class="step-indicator flex flex-col items-center">
                    <div class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-700 text-gray-400 font-bold">3</div>
                    <span class="text-xs mt-1 text-gray-400">Connect</span>
                </div>
            </div>
    
            <!-- Step Content Area -->
            <div id="content-area" class="min-h-[250px]"></div>
    
            <!-- Tips Section -->
            <div id="tips-section" class="mt-8 pt-4 border-t border-gray-700">
                <h3 class="text-lg font-bold text-genz-secondary mb-3">💡 Tips for an Awesome Profile</h3>
                <ul class="space-y-2 text-gray-300 text-sm">
                    <li class="flex items-start">
                        <span class="mr-2 text-genz-primary flex-shrink-0">✨</span>
                        <span>Be <strong>authentic</strong> – let your personality shine!</span>
                    </li>
                    <li class="flex items-start">
                        <span class="mr-2 text-genz-primary flex-shrink-0">🔗</span>
                        <span>Link your socials for easier connections.</span>
                    </li>
                    <li class="flex items-start">
                        <span class="mr-2 text-genz-primary flex-shrink-0">🔄</span>
                        <span>Update your profile regularly to keep it fresh.</span>
                    </li>
                </ul>
            </div>
            
                <!-- Action Button -->
                <div class="mt-10">
                    <button id="action-button" class="vibrant-btn w-full py-4 text-xl font-extrabold rounded-xl bg-genz-primary text-gray-900 hover:bg-genz-secondary hover:text-white transition-all transform duration-300">
                        Create Account
                    </button>
                    <p id="status-message" class="text-center mt-3 text-sm text-lime-400 hidden">Signing up...</p>
                </div>
        
            </div>
    
        <script>
            let currentStep = 1;
            const totalSteps = 3;
            let currentView = 'home';
            let userData = {};
            let posts = [
                { id: 1, username: 'VibeLord99', time: '5m', caption: 'Just dropped a new beat! Link in bio. 🔥', image: 'https://placehold.co/400x400/8b5cf6/ffffff?text=BEAT+DROP', likes: 1200, liked: false, comments: [] },
                { id: 2, username: 'CryptoQueen', time: '1h', caption: 'DCA is the way. 🚀 Who else is holding strong? #stocks #crypto', image: 'https://placehold.co/400x500/f0abfc/000000?text=GRIND+SET+GROW', likes: 589, liked: false, comments: [] },
                { id: 3, username: 'PixelArtist', time: '3h', caption: 'Testing out new color palettes for my next NFT collection. Thoughts? 🎨', image: 'https://placehold.co/400x450/475569/ffffff?text=AESTHETIC+DESIGN', likes: 2700, liked: false, comments: [] }
            ];
    
            const contentArea = document.getElementById('content-area');
            const actionButton = document.getElementById('action-button');
            const tagline = document.getElementById('tagline');
            const statusMessage = document.getElementById('status-message');
            const tipsSection = document.getElementById('tips-section');
            const stepIndicators = document.getElementById('step-indicators');
            const appContainer = document.getElementById('app-container');
    
            const steps = [
                {
                    title: "1️⃣ Sign Up in Seconds",
                    content: `
                        <div class="space-y-4">
                            <p class="text-gray-300">Use your email, phone, or social login. Fast & secure – we value your privacy.</p>
                            <input type="email" id="email-input" placeholder="Email or Phone Number" class="w-full p-3 rounded-lg bg-gray-700 border border-genz-secondary focus:border-genz-primary focus:ring-1 focus:ring-genz-primary outline-none transition-all" required>
                            <input type="password" id="password-input" placeholder="Create Password" class="w-full p-3 rounded-lg bg-gray-700 border border-gray-700 focus:border-genz-primary focus:ring-1 focus:ring-genz-primary outline-none transition-all" required>
                            <button class="w-full py-2 rounded-lg bg-gray-800 text-gray-300 hover:bg-gray-700 transition-all border border-gray-700">Continue with Google / Apple</button>
                        </div>`,
                    buttonText: "Create Account →",
                    tagline: "Just one step to join the community."
                },
                {
                    title: "2️⃣ Personalize Your Profile",
                    content: `
                        <div class="space-y-6">
                            <p class="text-gray-300">Add a profile picture & bio. Choose your interests to get content and connections you’ll love.</p>
                            <div class="flex items-center space-x-4">
                                <input type="file" id="profile-pic-upload" accept="image/*" class="hidden">
                                <label for="profile-pic-upload" class="w-16 h-16 bg-genz-secondary rounded-full flex items-center justify-center text-3xl cursor-pointer hover:bg-genz-primary hover:text-gray-900 transition-all">📸</label>
                                <input type="text" id="username-input" placeholder="Your Vibe/Username" class="flex-grow p-3 rounded-lg bg-gray-700 border border-gray-700 focus:border-genz-primary focus:ring-1 focus:ring-genz-primary outline-none transition-all" required>
                            </div>
                            <textarea id="bio-input" placeholder="Write a quick bio (max 150 chars)" maxlength="150" class="w-full p-3 rounded-lg bg-gray-700 border border-gray-700 focus:border-genz-primary focus:ring-1 focus:ring-genz-primary outline-none transition-all h-20 resize-none"></textarea>
                            <div class="grid grid-cols-2 gap-2 text-sm">
                                <label class="flex items-center p-2 rounded-full bg-gray-700 hover:bg-gray-600 cursor-pointer transition-all">
                                    <input type="checkbox" class="rounded text-genz-primary focus:ring-genz-primary mr-2" value="gaming"> 👾 Gaming
                                </label>
                                <label class="flex items-center p-2 rounded-full bg-gray-700 hover:bg-gray-600 cursor-pointer transition-all">
                                    <input type="checkbox" class="rounded text-genz-primary focus:ring-genz-primary mr-2" value="music"> 🎶 Music
                                </label>
                                <label class="flex items-center p-2 rounded-full bg-gray-700 hover:bg-gray-600 cursor-pointer transition-all">
                                    <input type="checkbox" class="rounded text-genz-primary focus:ring-genz-primary mr-2" value="art"> 🎨 Art & Design
                                </label>
                                <label class="flex items-center p-2 rounded-full bg-gray-700 hover:bg-gray-600 cursor-pointer transition-all">
                                    <input type="checkbox" class="rounded text-genz-primary focus:ring-genz-primary mr-2" value="tech"> 💻 Tech
                                </label>
                                <label class="flex items-center p-2 rounded-full bg-gray-700 hover:bg-gray-600 cursor-pointer transition-all">
                                    <input type="checkbox" class="rounded text-genz-primary focus:ring-genz-primary mr-2" value="movies"> 🍿 Movies
                                </label>
                                <label class="flex items-center p-2 rounded-full bg-gray-700 hover:bg-gray-600 cursor-pointer transition-all">
                                    <input type="checkbox" class="rounded text-genz-primary focus:ring-genz-primary mr-2" value="stocks"> 📈 Stocks & Crypto
                                </label>
                            </div>
                        </div>`,
                    buttonText: "Set Up Profile →",
                    tagline: "Make your space uniquely you."
                },
                {
                    title: "3️⃣ Explore & Connect",
                    content: `
                        <div class="text-center p-4">
                            <div class="text-7xl mb-6">🎉</div>
                            <h2 class="text-3xl font-extrabold text-genz-primary mb-3">You're All Set!</h2>
                            <p class="text-xl text-gray-300">Welcome to the Hub! Tap below to enter the feed.</p>
                            <p class="mt-4 text-genz-secondary font-bold">Your journey starts now.</p>
                        </div>`,
                    buttonText: "Go to Feed",
                    tagline: "Welcome to the GenZ Social Hub!"
                }
            ];
    
            function validateEmail(email) {
                const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return re.test(email);
            }
    
            function updateStepIndicators(step) {
                for (let i = 1; i <= totalSteps; i++) {
                    const stepElement = document.getElementById('step-' + i);
                    const lineElement = document.getElementById('line-' + (i - 1));
                    const circle = stepElement.querySelector('div');
                    const label = stepElement.querySelector('span');
    
                    if (i < step) {
                        circle.className = 'w-10 h-10 flex items-center justify-center rounded-full bg-lime-400 text-gray-900 font-bold';
                        label.className = 'text-xs mt-1 text-lime-400 font-medium';
                        if (lineElement) lineElement.className = 'flex-1 h-1 mx-2 bg-lime-400 rounded-full transition-all';
                    } else if (i === step) {
                        circle.className = 'w-10 h-10 flex items-center justify-center rounded-full bg-genz-primary text-gray-900 font-bold scale-110';
                        label.className = 'text-xs mt-1 text-genz-primary font-medium';
                        if (lineElement) lineElement.className = 'flex-1 h-1 mx-2 bg-gray-700 rounded-full transition-all';
                    } else {
                        circle.className = 'w-10 h-10 flex items-center justify-center rounded-full bg-gray-700 text-gray-400 font-bold';
                        label.className = 'text-xs mt-1 text-gray-400';
                        if (lineElement) lineElement.className = 'flex-1 h-1 mx-2 bg-gray-700 rounded-full transition-all';
                    }
                }
            }
    
            function renderStep(stepIndex) {
                const stepData = steps[stepIndex - 1];
                contentArea.innerHTML = `
                    <h2 class="text-2xl md:text-3xl font-extrabold text-white mb-6 text-center">${stepData.title}</h2>
                    ${stepData.content}`;
                
                actionButton.textContent = stepData.buttonText;
                tagline.textContent = stepData.tagline;
                actionButton.style.display = 'block';
                statusMessage.classList.add('hidden');
                updateStepIndicators(stepIndex);
    
                if (stepIndex === 2) {
                    const profilePicInput = document.getElementById('profile-pic-upload');
                    profilePicInput.addEventListener('change', (e) => {
                        const file = e.target.files[0];
                        if (file) {
                            const reader = new FileReader();
                            reader.onload = (event) => {
                                userData.profilePic = event.target.result;
                                const label = document.querySelector('label[for="profile-pic-upload"]');
                                label.style.backgroundImage = `url(${event.target.result})`;
                                label.style.backgroundSize = 'cover';
                                label.textContent = '';
                            };
                            reader.readAsDataURL(file);
                        }
                    });
                }
            }
    
            function validateStep(step) {
                if (step === 1) {
                    const email = document.getElementById('email-input').value;
                    const password = document.getElementById('password-input').value;
                    if (!email || !password) {
                        alert('Please fill in email and password.');
                        return false;
                    }
                    if (!validateEmail(email)) {
                        alert('Please enter a valid email address.');
                        return false;
                    }
                    userData.email = email;
                    userData.password = password; // In real app, hash this
                    return true;
                } else if (step === 2) {
                    const username = document.getElementById('username-input').value;
                    const bio = document.getElementById('bio-input').value;
                    const interests = Array.from(document.querySelectorAll('input[type="checkbox"]:checked')).map(cb => cb.value);
                    if (!username) {
                        alert('Please choose a username.');
                        return false;
                    }
                    userData.username = username;
                    userData.bio = bio;
                    userData.interests = interests;
                    return true;
                }
                return true;
            }
    
            function nextStep() {
                if (!validateStep(currentStep)) return;
    
                if (currentStep < totalSteps) {
                    actionButton.disabled = true;
                    actionButton.textContent = "Processing...";
                    statusMessage.textContent = `Loading Step ${currentStep + 1}...`;
                    statusMessage.classList.remove('hidden');
    
                    setTimeout(() => {
                        currentStep++;
                        renderStep(currentStep);
                        actionButton.disabled = false;
                        statusMessage.classList.add('hidden');
                    }, 1200);
                } else if (currentStep === totalSteps) {
                    actionButton.disabled = true;
                    actionButton.textContent = "Loading Feed...";
                    statusMessage.textContent = "Entering the Hub...";
                    statusMessage.classList.remove('hidden');
    
                    setTimeout(() => {
                        renderFeed();
                    }, 1500);
                }
            }
    
            function updateNavActive(view) {
                const navButtons = document.querySelectorAll('#bottom-nav-bar button');
                navButtons.forEach(btn => {
                    btn.classList.remove('text-genz-primary');
                    btn.classList.add('text-gray-400', 'hover:text-white');
                });
                const activeBtn = document.getElementById('nav-' + view);
                if (activeBtn) {
                    activeBtn.classList.add('text-genz-primary');
                    activeBtn.classList.remove('text-gray-400', 'hover:text-white');
                }
            }
    
            function showStatusMessage(message, duration = 3000) {
                const feedStatus = document.getElementById('feed-status-message');
                const feedStatusBar = document.getElementById('feed-status-bar');
                if (feedStatus && feedStatusBar) {
                    feedStatus.textContent = message;
                    feedStatusBar.classList.remove('hidden');
                    setTimeout(() => {
                        feedStatusBar.classList.add('hidden');
                    }, duration);
                }
            }
    
            function renderView(view) {
                currentView = view;
                updateNavActive(view);
                let viewHtml = `
                    <div id="feed-status-bar" class="absolute top-0 left-0 right-0 z-50 p-3 bg-genz-secondary text-white text-center text-sm hidden max-w-md mx-auto rounded-b-xl transition-all shadow-xl">
                        <span id="feed-status-message" class="font-medium"></span>
                    </div>
                    <div id="top-nav" class="sticky top-0 z-10 bg-gray-900 border-b border-gray-800 p-3 flex justify-between items-center">
                        <span class="text-xl font-extrabold text-genz-primary cursor-pointer" onclick="renderView('home')">GenZ Hub</span>
                        <div class="flex space-x-4">
                            <button id="btn-messages" class="text-white text-2xl hover:text-genz-primary transition-colors">✈️</button>
                            <button id="btn-notifications" class="text-white text-2xl hover:text-genz-primary transition-colors">❤️</button>
                        </div>
                    </div>`;
    
                if (view === 'home') {
                    viewHtml += `
                        <div class="p-3 border-b border-gray-800 overflow-x-scroll whitespace-nowrap scroll-smooth">
                            <div class="flex space-x-4">
                                <div class="text-center inline-block">
                                    <div class="w-14 h-14 bg-genz-secondary rounded-full flex items-center justify-center border-2 border-genz-primary p-0.5 mx-auto" style="background-image: url(${userData.profilePic || ''}); background-size: cover;">
                                        ${!userData.profilePic ? '<div class="w-full h-full bg-gray-700 rounded-full flex items-center justify-center text-xl">👤</div>' : ''}
                                    </div>
                                    <span class="text-xs text-gray-400 mt-1 block">Your Story</span>
                                </div>`;
                    for (let j = 0; j < 5; j++) {
                        viewHtml += `
                            <div class="text-center inline-block">
                                <div class="w-14 h-14 bg-genz-primary rounded-full flex items-center justify-center border-2 border-genz-secondary p-0.5 mx-auto">
                                    <div class="w-full h-full bg-gray-800 rounded-full"></div>
                                </div>
                                <span class="text-xs text-gray-400 mt-1 block">Friend ${j + 1}</span>
                            </div>`;
                    }
                    viewHtml += `</div></div>`;
                }
    
                viewHtml += `<div id="view-content" class="pb-16">`;
    
                if (view === 'home') {
                    posts.forEach(post => {
                        viewHtml += `
                            <div class="bg-gray-800 border-b border-gray-700 mb-4 shadow-lg">
                                <div class="p-3 flex justify-between items-center">
                                    <div class="flex items-center">
                                        <div class="w-8 h-8 bg-genz-secondary rounded-full mr-3 border border-genz-primary"></div>
                                        <span class="font-bold text-white">${post.username}</span>
                                    </div>
                                    <span class="text-gray-500 text-sm">${post.time}</span>
                                </div>
                                <div class="w-full h-auto max-h-[600px] bg-gray-700 flex items-center justify-center overflow-hidden">
                                    <img src="${post.image}" alt="Post image for ${post.username}" class="w-full h-auto object-cover" onerror="this.src='https://placehold.co/400x400/475569/ffffff?text=Image+Load+Error'">
                                </div>
                                <div class="p-3 flex justify-between items-center">
                                    <div class="flex space-x-4 text-2xl">
                                        <button class="like-btn" data-post-id="${post.id}" style="color: ${post.liked ? '#ff0000' : '#ffffff'}" onclick="toggleLike(${post.id})">❤️</button>
                                        <button class="comment-btn" data-post-id="${post.id}" onclick="showCommentInput(${post.id})">💬</button>
                                        <button class="share-btn">➣</button>
                                    </div>
                                    <button class="save-btn hover:text-genz-primary transition-colors text-2xl">💾</button>
                                </div>
                                <div class="px-3 pb-4 text-sm">
                                    <p class="font-bold text-white mb-1">${post.likes} likes</p>
                                    <p>
                                        <span class="font-bold text-white">${post.username}</span>
                                        <span class="text-gray-300">${post.caption}</span>
                                    </p>
                                    <p class="text-gray-500 mt-1 cursor-pointer" onclick="showComments(${post.id})">View all ${post.comments.length} comments...</p>
                                    <div id="comments-${post.id}" class="mt-2"></div>
                                    <div id="comment-input-${post.id}" class="hidden mt-2 flex">
                                        <input type="text" placeholder="Add a comment..." class="flex-grow p-2 rounded-l-lg bg-gray-700 border border-gray-700 focus:border-genz-primary outline-none">
                                        <button class="post-comment-btn bg-genz-primary text-gray-900 p-2 rounded-r-lg" onclick="postComment(${post.id})">Post</button>
                                    </div>
                                </div>
                            </div>`;
                    });
                } else if (view === 'search') {
                    viewHtml += `
                        <div class="p-4">
                            <input type="text" placeholder="Search..." class="w-full p-3 rounded-lg bg-gray-700 border border-gray-700 focus:border-genz-primary outline-none mb-4">
                            <div class="grid grid-cols-3 gap-1">
                                ${Array(9).fill().map((_, i) => `
                                    <div class="aspect-square bg-gray-800">
                                        <img src="https://placehold.co/150x150/475569/ffffff?text=Post+${i+1}" class="w-full h-full object-cover">
                                    </div>
                                `).join('')}
                            </div>
                        </div>`;
                } else if (view === 'create') {
                    viewHtml += `
                        <div class="p-4">
                            <h2 class="text-2xl font-bold mb-4">Create a New Post</h2>
                            <input type="file" id="post-image-upload" accept="image/*" class="w-full p-3 rounded-lg bg-gray-700 border border-gray-700 mb-4">
                            <textarea id="post-textarea" placeholder="What's on your mind?" class="w-full p-3 rounded-lg bg-gray-700 border border-gray-700 mb-4 h-32"></textarea>
                            <button id="post-button" class="w-full py-3 rounded-lg bg-genz-primary text-gray-900 font-bold">Share</button>
                        </div>`;
                } else if (view === 'reels') {
                    viewHtml += `
                        <div class="p-4 text-center">
                            <h2 class="text-2xl font-bold mb-4">Reels</h2>
                            ${Array(3).fill().map((_, i) => `
                                <div class="mb-4">
                                    <div class="w-full h-[400px] bg-gray-700 flex items-center justify-center">
                                        <img src="https://placehold.co/300x400/8b5cf6/ffffff?text=Reel+${i+1}" class="w-full h-full object-cover">
                                    </div>
                                    <p class="text-gray-300 mt-2">Reel by User${i+1}</p>
                                </div>
                            `).join('')}
                        </div>`;
                } else if (view === 'profile') {
                    const userPosts = posts.filter(post => post.username === userData.username);
                    viewHtml += `
                        <div class="p-4">
                            <div class="flex items-center mb-6">
                                <div class="w-20 h-20 bg-genz-secondary rounded-full mr-4 flex items-center justify-center text-4xl" style="background-image: url(${userData.profilePic || ''}); background-size: cover;">
                                    ${!userData.profilePic ? '👤' : ''}
                                </div>
                                <div class="flex-1">
                                    <h2 class="text-xl font-bold">${userData.username || 'User'}</h2>
                                    <p class="text-gray-400">${userData.bio || 'No bio yet'}</p>
                                    <div class="flex space-x-4 mt-2">
                                        <span><strong>${userPosts.length}</strong> posts</span>
                                        <span><strong>1.2k</strong> followers</span>
                                        <span><strong>350</strong> following</span>
                                    </div>
                                </div>
                            </div>
                            <div class="flex justify-around mb-4">
                                <button id="edit-profile-btn" class="py-2 px-4 rounded-lg bg-genz-secondary text-white font-bold">Edit Profile</button>
                                <button class="py-2 px-4 rounded-lg bg-gray-700 text-white font-bold">Share Profile</button>
                            </div>
                            <h3 class="text-xl font-bold mb-2">Interests</h3>
                            <ul class="list-disc pl-6 text-gray-300 mb-4">
                                ${userData.interests ? userData.interests.map(i => `<li>${i.charAt(0).toUpperCase() + i.slice(1)}</li>`).join('') : '<li>No interests selected</li>'}
                            </ul>
                            <div class="grid grid-cols-3 gap-1">
                                ${userPosts.map(post => `
                                    <div class="aspect-square bg-gray-800">
                                        <img src="${post.image}" class="w-full h-full object-cover">
                                    </div>
                                `).join('')}
                            </div>
                        </div>`;
                } else if (view === 'messages') {
                    viewHtml += `
                        <div class="p-4">
                            <h2 class="text-2xl font-bold mb-4">Messages</h2>
                            <input type="text" placeholder="Search messages..." class="w-full p-3 rounded-lg bg-gray-700 border border-gray-700 focus:border-genz-primary outline-none mb-4">
                            <div class="space-y-4">
                                <div class="flex items-center">
                                    <div class="w-12 h-12 bg-genz-primary rounded-full mr-3 flex items-center justify-center">F1</div>
                                    <div class="flex-1">
                                        <p class="font-bold">Friend1</p>
                                        <p class="text-gray-400 text-sm">Hey! How are you?</p>
                                    </div>
                                    <span class="text-gray-500 text-sm">2h</span>
                                </div>
                                <div class="flex items-center">
                                    <div class="w-12 h-12 bg-genz-secondary rounded-full mr-3 flex items-center justify-center">F2</div>
                                    <div class="flex-1">
                                        <p class="font-bold">Friend2</p>
                                        <p class="text-gray-400 text-sm">What's up? Let's game!</p>
                                    </div>
                                    <span class="text-gray-500 text-sm">1h</span>
                                </div>
                            </div>
                        </div>`;
                }
    
                viewHtml += `</div>
                    <div id="bottom-nav-bar" class="fixed bottom-0 left-0 right-0 bg-gray-900 border-t border-genz-secondary p-3 flex justify-around items-center max-w-md mx-auto rounded-t-2xl shadow-2xl">
                        <button id="nav-home" class="flex flex-col items-center text-${view === 'home' ? 'genz-primary' : 'gray-400 hover:text-white'} transition-colors">
                            <span class="text-2xl">🏠</span>
                            <span class="text-xs">Home</span>
                        </button>
                        <button id="nav-search" class="flex flex-col items-center text-${view === 'search' ? 'genz-primary' : 'gray-400 hover:text-white'} transition-colors">
                            <span class="text-2xl">🔍</span>
                            <span class="text-xs">Search</span>
                        </button>
                        <button id="nav-create" class="flex flex-col items-center text-${view === 'create' ? 'genz-primary' : 'gray-400 hover:text-white'} transition-colors">
                            <span class="text-2xl">➕</span>
                            <span class="text-xs">Post</span>
                        </button>
                        <button id="nav-reels" class="flex flex-col items-center text-${view === 'reels' ? 'genz-primary' : 'gray-400 hover:text-white'} transition-colors">
                            <span class="text-2xl">🎬</span>
                            <span class="text-xs">Reels</span>
                        </button>
                        <button id="nav-profile" class="flex flex-col items-center text-${view === 'profile' ? 'genz-primary' : 'gray-400 hover:text-white'} transition-colors">
                            <span class="text-2xl">👤</span>
                            <span class="text-xs">Profile</span>
                        </button>
                    </div>`;
    
                contentArea.innerHTML = viewHtml;
                attachNavListeners();
                attachViewListeners();
                showStatusMessage(`Loaded ${view.charAt(0).toUpperCase() + view.slice(1)} view`, 2000);
            }
    
            function toggleLike(postId) {
                const post = posts.find(p => p.id === postId);
                if (post) {
                    post.liked = !post.liked;
                    post.likes += post.liked ? 1 : -1;
                    renderView(currentView);
                    showStatusMessage(post.liked ? 'Liked!' : 'Unliked!', 1500);
                }
            }
    
            function showCommentInput(postId) {
                const commentInput = document.getElementById(`comment-input-${postId}`);
                if (commentInput) {
                    commentInput.classList.toggle('hidden');
                }
            }
    
            function postComment(postId) {
                const commentInput = document.getElementById(`comment-input-${postId}`).querySelector('input');
                const commentText = commentInput.value.trim();
                if (commentText) {
                    const post = posts.find(p => p.id === postId);
                    if (post) {
                        post.comments.push({ username: userData.username || 'You', text: commentText, time: 'now' });
                        commentInput.value = '';
                        renderView(currentView);
                        showStatusMessage('Comment posted!', 1500);
                    }
                }
            }
    
            function showComments(postId) {
                const post = posts.find(p => p.id === postId);
                const commentsDiv = document.getElementById(`comments-${postId}`);
                if (commentsDiv && post.comments.length > 0) {
                    commentsDiv.innerHTML = post.comments.map(c => `
                        <div class="flex mt-2">
                            <span class="font-bold text-white mr-2">${c.username}</span>
                            <span class="text-gray-300">${c.text}</span>
                        </div>
                    `).join('');
                }
            }
    
            function attachNavListeners() {
                const navMap = {
                    'nav-home': 'home',
                    'nav-search': 'search',
                    'nav-create': 'create',
                    'nav-reels': 'reels',
                    'nav-profile': 'profile'
                };
                Object.keys(navMap).forEach(id => {
                    const btn = document.getElementById(id);
                    if (btn) {
                        btn.addEventListener('click', () => renderView(navMap[id]));
                    }
                });
    
                const btnMessages = document.getElementById('btn-messages');
                if (btnMessages) {
                    btnMessages.addEventListener('click', () => renderView('messages'));
                }
    
                const btnNotifications = document.getElementById('btn-notifications');
                if (btnNotifications) {
                    btnNotifications.addEventListener('click', () => {
                        showStatusMessage('No new notifications', 2000);
                    });
                }
            }
    
            function attachViewListeners() {
                if (currentView === 'create') {
                    const postBtn = document.getElementById('post-button');
                    const textarea = document.getElementById('post-textarea');
                    const imageInput = document.getElementById('post-image-upload');
                    if (postBtn && textarea) {
                        postBtn.addEventListener('click', () => {
                            const caption = textarea.value.trim();
                            const file = imageInput.files[0];
                            if (!caption && !file) {
                                alert('Please add a caption or image to post!');
                                return;
                            }
                            const newPost = {
                                id: posts.length + 1,
                                username: userData.username || 'You',
                                time: 'now',
                                caption: caption,
                                image: file ? URL.createObjectURL(file) : 'https://placehold.co/400x400/f0abfc/000000?text=NEW+POST',
                                likes: 0,
                                liked: false,
                                comments: []
                            };
                            posts.unshift(newPost);
                            showStatusMessage('Post created successfully!', 1500);
                            textarea.value = '';
                            imageInput.value = '';
                            setTimeout(() => renderView('home'), 1500);
                        });
                    }
                }
    
                if (currentView === 'profile') {
                    const editBtn = document.getElementById('edit-profile-btn');
                    if (editBtn) {
                        editBtn.addEventListener('click', () => {
                            currentStep = 2;
                            renderStep(currentStep);
                            showStatusMessage('Editing profile...', 1500);
                        });
                    }
                }
            }
    
            function renderFeed() {
                appContainer.className = 'w-full max-w-md bg-gray-900 text-white rounded-3xl glow-card p-0 transition-all border-2 border-genz-secondary overflow-y-auto h-full min-h-screen';
                document.body.className = 'bg-genz-bg font-sans min-h-screen flex justify-center p-0';
                document.querySelector('header').style.display = 'none';
                actionButton.style.display = 'none';
                statusMessage.style.display = 'none';
                tipsSection.style.display = 'none';
                stepIndicators.style.display = 'none';
                contentArea.className = 'p-0';
                renderView('home');
            }
    
            window.onload = () => {
                renderStep(currentStep);
                actionButton.addEventListener('click', nextStep);
            };
        </script>
    </body>

</html>
